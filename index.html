<script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
<script>
  //zachs hydra library test, 1 changed canvas size ,2  changed osc time,3 changed width of osc  ,4 changed colors ,5  //
  /* global Hydra, osc */
  function setup () {
    const canvas = document.createElement('canvas')
    canvas.width = 800
    canvas.height = 800

    const hydra = new Hydra({
      canvas,
      detectAudio: false
    })

    osc(3, 0.3, 1.3)
      .color(1, 0.1, 0.1)
      .out()

    document.body.appendChild(hydra.canvas)
  }

  window.addEventListener('load', setup)
</script>
